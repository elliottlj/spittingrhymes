  #stats-btn { position: fixed; top: 66px; right: 14px; z-index: 100; font-size: 13px; padding: 6px 12px; }
  #faq-btn { position: fixed; top: 105px; right: 14px; z-index: 100; font-size: 13px; padding: 6px 12px; }
  .panel-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200; }

  .panel { position: fixed; top: 0; right: 0; height: 100%; width: 320px; max-width: 85vw; background: #fff; box-shadow: -2px 0 12px rgba(0,0,0,0.15); padding: 18px 16px; overflow-y: auto; transform: translateX(100%); transition: transform 0.2s ease; }
  .panel-overlay.open .panel { transform: translateX(0); }
  .panel h2 { font-size: 16px; margin-bottom: 8px; }
  .panel h2:not(:first-child) { margin-top: 18px; }
  .panel-close-btn { position: absolute; top: 12px; right: 12px; font-size: 14px; padding: 4px 9px; }
  #stats-clear-btn { position: absolute; top: 12px; right: 52px; font-size: 14px; padding: 4px 9px; }
  .stats-empty { color: #888; font-size: 13px; }
  table.stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.stats-table th, table.stats-table td { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; }
  table.stats-table th { color: #666; font-weight: 600; }
  table.stats-table td.stats-score { font-weight: 600; }
  table.stats-table td.stats-date { color: #777; font-size: 12px; white-space: nowrap; }
  table.stats-table td.stats-duration { color: #777; font-size: 12px; white-space: nowrap; }
  #faq-content p { font-size: 13px; color: #444; line-height: 1.5; margin: 4px 0; }
  #faq-content p.faq-q { font-size: 13.5px; font-weight: 600; color: #111; margin-top: 16px; }
  #faq-content h2:first-child { margin-top: 0; }

</style>

  <p style="color:#666;font-size:14px;">Loading dictionary…</p>

</div>

<script>
  fetch('https://liamteacher.com/header.html', { cache: 'no-store' })
    .then(r => r.text())
    .then(html => { document.getElementById('shared-header').innerHTML = html; })
    .catch(() => {});
  fetch('https://liamteacher.com/footer.html', { cache: 'no-store' })
    .then(r => r.text())
    .then(html => { document.getElementById('shared-footer').innerHTML = html; })
    .catch(() => {});

<script>
let cmuDict = {};
let randomWords = [];
let commonWords = [];

const STATS_KEY = 'rhymerStats';

function loadStatsRecords() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveStatsRecords(records) {
  try {
    localStorage.setItem(STATS_KEY, JSON.stringify(records));
  } catch (e) {
    console.error('Failed to save stats:', e);
  }
}

function logRoundResult(word, score, trueCount, slantCount, duration) {
  const records = loadStatsRecords();
  records.push({ word, score, trueCount, slantCount, duration, date: new Date().toISOString() });
  saveStatsRecords(records);
}

// Lazy purge: run once on page load. Keep a record if it's within the
// last 30 days OR currently in the top 10 by score; discard otherwise.
function purgeStatsOnLoad() {
  const records = loadStatsRecords();
  if (records.length === 0) return;
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const top10Scores = [...records].sort((a, b) => b.score - a.score).slice(0, 10);
  const top10Set = new Set(top10Scores);
  const kept = records.filter(r => new Date(r.date).getTime() >= cutoff || top10Set.has(r));
  if (kept.length !== records.length) saveStatsRecords(kept);
}

function formatStatsDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function renderStatsTable(records, opts) {
  if (records.length === 0) {
    return '<p class="stats-empty">No rounds played yet</p>';
  }
  const rows = records.map(r => `
    <tr>
      <td>${r.word}</td>
      <td class="stats-score">${r.score}</td>
      <td>${r.trueCount}/${r.slantCount}</td>
      <td class="stats-duration">${r.duration != null ? r.duration + 's' : '—'}</td>
      <td class="stats-date">${opts.showDate ? formatStatsDate(r.date) : ''}</td>
    </tr>`).join('');
  return `<table class="stats-table">
    <thead><tr><th>Word</th><th>Score</th><th>T/S</th><th>Time</th><th>${opts.showDate ? 'When' : ''}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderStatsPanel() {
  const records = loadStatsRecords();
  const allTime = [...records].sort((a, b) => b.score - a.score).slice(0, 10);
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const recent = records
    .filter(r => new Date(r.date).getTime() >= cutoff)
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById('stats-alltime').innerHTML = renderStatsTable(allTime, { showDate: false });
  document.getElementById('stats-recent').innerHTML = renderStatsTable(recent, { showDate: true });
}

function openStatsPanel() {
  renderStatsPanel();
  document.getElementById('stats-overlay').classList.add('open');
}

function closeStatsPanel() {
  document.getElementById('stats-overlay').classList.remove('open');
}

function clearStatsHistory() {
  if (!confirm('Clear all saved stats history? This can\'t be undone.')) return;
  try {
    localStorage.removeItem(STATS_KEY);
  } catch (e) {
    console.error('Failed to clear stats:', e);
  }
  renderStatsPanel();
}


function getRhymeTail(phones) {
  for (let i = 0; i < phones.length; i++) {
    if (/[12]$/.test(phones[i])) return phones.slice(i);
  }
  return phones.slice(-2);
}

function stripStress(phones) {
  return phones.map(p => p.replace(/[012]$/, ''));
}

function classifyRhyme(targetWord, guessWord) {
  const tP = cmuDict[targetWord];
  const gP = cmuDict[guessWord];
  if (!tP || !gP) return null;
  const tTail = getRhymeTail(tP);
  const gTail = getRhymeTail(gP);
  const tNS = stripStress(tTail);
  const gNS = stripStress(gTail);
  if (tNS.join(' ') === gNS.join(' ')) return 'true';
  const tVowelIdx = tTail.findIndex(p => /[012]$/.test(p));
  const gVowelIdx = gTail.findIndex(p => /[012]$/.test(p));
  const tEnd = stripStress(tTail.slice(tVowelIdx + 1));
  const gEnd = stripStress(gTail.slice(gVowelIdx + 1));
  if (tEnd.length > 0 && tEnd.join(' ') === gEnd.join(' ')) return 'slant';
  if (tNS[0] === gNS[0]) return 'slant';
  return null;
}

function getAllTrueRhymes(target) {
  const tP = cmuDict[target];
  if (!tP) return [];
  const tTail = stripStress(getRhymeTail(tP)).join(' ');
  return Object.keys(cmuDict).filter(word => {
    if (word === target) return false;
    const gTail = stripStress(getRhymeTail(cmuDict[word])).join(' ');
    return gTail === tTail;
  });
}

function getShareUrl(word, seconds) {
  return window.location.origin + window.location.pathname + '#' + encodeURIComponent(word) + '-' + seconds;
}

// Read word (and optional seconds) from URL hash on load.
// Format: #word-seconds (e.g. #start-90), split on the LAST dash so
// hyphenated words still work. If the trailing segment isn't a valid
// number, the whole hash is treated as just the word (old-format link).
function getHashState() {
  const hash = window.location.hash.slice(1);
  if (!hash) return null;
  const decoded = decodeURIComponent(hash);
  const lastDash = decoded.lastIndexOf('-');
  if (lastDash === -1) return { word: decoded, seconds: null };
  const wordPart = decoded.slice(0, lastDash);
  const secondsPart = decoded.slice(lastDash + 1);
  const seconds = parseInt(secondsPart, 10);
  if (!wordPart || isNaN(seconds) || seconds <= 0 || String(seconds) !== secondsPart) {
    return { word: decoded, seconds: null };
  }
  return { word: wordPart, seconds };
}

let state = {};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(word, seconds) {
  const target = word.toLowerCase().trim();
  if (!cmuDict[target]) {
    document.getElementById('setup-error').textContent = `"${word}" not found in dictionary. Try another word.`;
    return;
  }
  // Clear any running timer from a previous round (e.g. mid-game restart)
  if (state.interval) clearInterval(state.interval);

  const duration = (typeof seconds === 'number' && seconds > 0)
    ? seconds
    : parseInt(document.getElementById('timer-select').value);

  // Update URL hash (word + seconds, so shared links reproduce both)
  window.location.hash = encodeURIComponent(target) + '-' + duration;

  state = { target, found: [], score: 0, duration, timer: duration, interval: null };
  document.getElementById('target-display').textContent = target;
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = state.timer;
  document.getElementById('timer').classList.remove('low');
  document.getElementById('found-list').innerHTML = '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  document.getElementById('guess-input').value = '';
  showScreen('game-screen');
  document.getElementById('guess-input').focus();
  state.interval = setInterval(() => {
    state.timer--;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = state.timer;
    if (state.timer <= 10) timerEl.classList.add('low');
    if (state.timer <= 0) endGame();
  }, 1000);
}

function submitGuess(raw) {
  const guess = raw.toLowerCase().trim();
  if (!guess) return;
  const fb = document.getElementById('feedback');
  fb.className = '';
  if (guess === state.target) { fb.textContent = "That\'s the target word!"; return; }
  if (state.found.find(f => f.word === guess)) { fb.textContent = 'Already found!'; return; }
  if (!cmuDict[guess]) {
    fb.textContent = `"${guess}" — not in dictionary`;
    state.found.push({ word: guess, type: 'invalid', pts: 0 });
    prependFoundItem(guess, 'invalid', 0);
    return;
  }
  const r = classifyRhyme(state.target, guess);
  if (r === 'true') {
    state.score += 10;
    fb.className = 'true';
    fb.textContent = '✓ True rhyme +10';
    state.found.push({ word: guess, type: 'true', pts: 10 });
    prependFoundItem(guess, 'true', 10);
  } else if (r === 'slant') {
    state.score += 2;
    fb.className = 'slant';
    fb.textContent = '~ Slant rhyme +2';
    state.found.push({ word: guess, type: 'slant', pts: 2 });
    prependFoundItem(guess, 'slant', 2);
  } else {
    fb.className = 'invalid';
    fb.textContent = '✗ Not a rhyme';
    state.found.push({ word: guess, type: 'invalid', pts: 0 });
    prependFoundItem(guess, 'invalid', 0);
  }
  document.getElementById('score').textContent = state.score;
}

function prependFoundItem(word, type, pts) {
  const li = document.createElement('li');
  li.className = type;
  li.textContent = type === 'true' ? `${word} (+10)` : type === 'slant' ? `${word} (+2)` : `${word} (0)`;
  document.getElementById('found-list').prepend(li);
}

function endGame() {
  clearInterval(state.interval);
  const trueCount = state.found.filter(f => f.type === 'true').length;
  const slantCount = state.found.filter(f => f.type === 'slant').length;
  logRoundResult(state.target, state.score, trueCount, slantCount, state.duration);
  document.getElementById('final-score').textContent = state.score;
  document.getElementById('found-summary').textContent =
    `${trueCount} true rhyme${trueCount !== 1 ? 's' : ''}, ${slantCount} slant rhyme${slantCount !== 1 ? 's' : ''} found`;

  // Share URL
  const shareUrl = getShareUrl(state.target, state.duration);
  document.getElementById('share-url').textContent = shareUrl;
  const copyBtn = document.getElementById('copy-btn');
  copyBtn.className = '';
  copyBtn.textContent = '📋 Copy link';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(shareUrl).then(() => {
      copyBtn.textContent = '✓ Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '📋 Copy link';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  };

  const rf = document.getElementById('results-found');
  rf.innerHTML = '';
  state.found.forEach(f => {
    const li = document.createElement('li');
    li.className = f.type;
    li.textContent = f.type === 'true' ? `${f.word} (+10)` : f.type === 'slant' ? `${f.word} (+2)` : `${f.word} (0)`;
    rf.appendChild(li);
  });

  showScreen('results-screen');
  document.getElementById('calculating').style.display = 'block';
  document.getElementById('missed-grid').innerHTML = '';
  const nsList = document.getElementById('missed-grid-nonstandard');
  const nsBtn = document.getElementById('toggle-nonstandard-btn');
  nsList.innerHTML = '';
  nsList.style.display = 'none';
  nsBtn.style.display = 'none';
  nsBtn.textContent = 'Show non-standard words';

  setTimeout(() => {
    const foundWords = new Set(state.found.filter(f => f.type === 'true').map(f => f.word));
    const missedTrue = getAllTrueRhymes(state.target).filter(w => !foundWords.has(w)).sort();

    const standardWordSet = new Set(commonWords);
    const isStandard = w => standardWordSet.has(w);
    const missedStandard = missedTrue.filter(w => isStandard(w));
    const missedNonStandard = missedTrue.filter(w => !isStandard(w));

    document.getElementById('calculating').style.display = 'none';
    const mg = document.getElementById('missed-grid');
    if (missedTrue.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'You found them all!';
      mg.appendChild(li);
    } else if (missedStandard.length === 0) {
      const li = document.createElement('li');
      li.textContent = 'You found all the standard words!';
      mg.appendChild(li);
    } else {
      missedStandard.forEach(w => {
        const li = document.createElement('li');
        li.textContent = w;
        mg.appendChild(li);
      });
    }

    if (missedNonStandard.length > 0) {
      nsBtn.style.display = 'inline-block';
      missedNonStandard.forEach(w => {
        const li = document.createElement('li');
        li.textContent = w;
        nsList.appendChild(li);
      });
    }
  }, 50);
}

// Setup event listeners
document.getElementById('start-btn').addEventListener('click', () => {
  const val = document.getElementById('word-input').value.trim();
  if (val) { startGame(val); return; }
  // Pick random word from filtered list
  const word = randomWords[Math.floor(Math.random() * randomWords.length)];
  startGame(word);
});

document.getElementById('word-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('start-btn').click();
});

document.getElementById('guess-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    submitGuess(e.target.value);
    e.target.value = '';
  }
});

document.getElementById('toggle-nonstandard-btn').addEventListener('click', () => {
  const nsList = document.getElementById('missed-grid-nonstandard');
  const nsBtn = document.getElementById('toggle-nonstandard-btn');
  const isHidden = nsList.style.display === 'none';
  nsList.style.display = isHidden ? 'block' : 'none';
  nsBtn.textContent = isHidden ? 'Hide non-standard words' : 'Show non-standard words';
});

document.getElementById('give-up-btn').addEventListener('click', () => {
  endGame();
});

document.getElementById('new-random-btn').addEventListener('click', () => {
  const word = randomWords[Math.floor(Math.random() * randomWords.length)];
  startGame(word);
});

document.getElementById('stats-btn').addEventListener('click', openStatsPanel);
document.getElementById('stats-close-btn').addEventListener('click', closeStatsPanel);
document.getElementById('stats-clear-btn').addEventListener('click', clearStatsHistory);
document.getElementById('stats-overlay').addEventListener('click', e => {
  if (e.target.id === 'stats-overlay') closeStatsPanel();
});

// Minimal markdown renderer for faq.md: supports "## heading", "### question",
// plain paragraphs (blank-line separated), and **bold** within them.
function renderFaqMarkdown(md) {
  const boldify = text => text
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let html = '';
  let paragraph = [];
  const flush = () => {
    const text = paragraph.join(' ').trim();
    if (text) html += `<p>${boldify(text)}</p>`;
    paragraph = [];
  };
  md.split('\n').forEach(rawLine => {
    const line = rawLine.trim();
    if (line.startsWith('## ')) { flush(); html += `<h2>${boldify(line.slice(3))}</h2>`; }
    else if (line.startsWith('### ')) { flush(); html += `<p class="faq-q">${boldify(line.slice(4))}</p>`; }
    else if (line === '') { flush(); }
    else { paragraph.push(line); }
  });
  flush();
  return html;
}

let faqLoaded = false;
function loadFaqIfNeeded() {
  if (faqLoaded) return;
  faqLoaded = true;
  fetch('faq.md')
    .then(r => r.text())
    .then(md => { document.getElementById('faq-content').innerHTML = renderFaqMarkdown(md); })
    .catch(() => {
      document.getElementById('faq-content').innerHTML = '<p>Could not load FAQ content.</p>';
    });
}

document.getElementById('faq-btn').addEventListener('click', () => {
  loadFaqIfNeeded();
  document.getElementById('faq-overlay').classList.add('open');
});
document.getElementById('faq-close-btn').addEventListener('click', () => {
  document.getElementById('faq-overlay').classList.remove('open');
});
document.getElementById('faq-overlay').addEventListener('click', e => {
  if (e.target.id === 'faq-overlay') document.getElementById('faq-overlay').classList.remove('open');
});

document.getElementById('play-again-btn').addEventListener('click', () => {
  window.location.hash = '';
  document.getElementById('word-input').value = '';
  document.getElementById('setup-error').textContent = '';
  showScreen('setup-screen');
});

// On load: check for hash word (and optional seconds) and pre-fill
const hashState = getHashState();
if (hashState) {
  document.getElementById('word-input').value = hashState.word;
  if (hashState.seconds != null) {
    const timerSelect = document.getElementById('timer-select');
    const matchingOption = Array.from(timerSelect.options).find(o => parseInt(o.value, 10) === hashState.seconds);
    if (matchingOption) {
      timerSelect.value = String(hashState.seconds);
    } else {
      // Arbitrary/custom duration not in the preset list — add it so the
      // dropdown reflects exactly what's in the shared link.
      const opt = document.createElement('option');
      opt.value = String(hashState.seconds);
      opt.textContent = `${hashState.seconds} seconds (from link)`;
      opt.selected = true;
      timerSelect.appendChild(opt);
    }
  }
}

// Lazy purge of old/low-score stats records, once per page load
purgeStatsOnLoad();


// Load dictionary data, then reveal the setup screen
Promise.all([
  fetch('cmudict.json').then(r => r.json()),
  fetch('randomwords.json').then(r => r.json()),
  fetch('commonwords.json').then(r => r.json())
]).then(([cmu, random, common]) => {
  cmuDict = cmu;
  randomWords = random;
  commonWords = common;
  showScreen('setup-screen');
}).catch(err => {
  document.getElementById('loading-screen').innerHTML =
    '<p style="color:#c00;font-size:14px;">Failed to load dictionary data. Make sure cmudict.json, randomwords.json, and commonwords.json are in the same folder as this file, and that it is served over http(s) rather than opened directly from disk.</p>';
  console.error('Dictionary load failed:', err);
});
</script>
